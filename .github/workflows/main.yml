name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bun Environment
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies with Bun
      run: bun install

    - name: Build web application with Vite
      run: npx vite build --emptyOutDir

    - name: Set up Node.js for Capacitor
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Add Capacitor and Android Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        npx cap init KidMonitor com.kidmonitor.app --web-dir dist
        npx cap add android
        npx cap copy

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kid-Monitor-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
